# My ongoing involvements: orgs and communities I'm part of, written in first
# person. Richer than a resume bullet, narrower than a work entry. Feeds the
# /involvement page and the `involvement` chat artifact.

involvement:
  - slug: "purdue-stack"
    title: "Purdue Stack"
    role: "Vice President of Marketing & Founding Member"
    org: "Purdue Stack"
    tagline: "Purdue's premier software development consulting club."
    link: "https://purduestack.org"
    location: "Purdue University, West Lafayette, IN"
    tools: "Branding, Marketing, Next.js, Recruitment Ops, Leadership"

    what_it_is: |
      Purdue Stack is Purdue's premier software development consulting club. The
      skills most sought after by employers are the ones the college curriculum
      doesn't begin to teach. We offer students the opportunity to gain
      experience on projects with real clients, real requirements, and real
      deadlines.
    my_role: |
      While my official title is VP of Marketing, Stack Exec is a dynamic team
      and we all help each other. I craft and refine the brand of Stack, from
      posters to in-person recruitment events. I lead the building of our
      website (purduestack.org) and our internal recruitment pipeline tools. I
      also lead committees on club merch as well as fundraising opportunities.

    # POV paragraphs — what I actually think about this work. These are the
    # lines the chat will want to quote when someone asks "why Purdue Stack?"
    point_of_view:
      - |
        One thing I've realized is the importance of marketing in today's tech
        sphere. Even if you know you have the best product, it doesn't matter
        unless other people know about you, can find your website, and find what
        they're looking for quickly. Likewise, I believe if you cannot market
        yourself, then no one will find you. Even in a corporate environment,
        the ability to market your ideas is critical to a successful career.
        Being in this role has expanded my capability on this frontier, and I
        have a better sense of what it takes to advertise something, myself
        included.

  - slug: "purdue-wind-ensemble"
    title: "Purdue Wind Ensemble"
    role: "Performer"
    org: "Purdue Wind Ensemble"
    tagline: "Purdue's flagship wind band."
    location: "Purdue University, West Lafayette, IN"

    what_it_is: |
      The Purdue Wind Ensemble is the most skilled band at Purdue, and has
      performed across the globe at prestigious venues including Carnegie Hall.
      Most recently, we performed on tour across Spain.

    point_of_view:
      - |
        More than just my role in this ensemble, practicing clarinet has taught
        me the importance of learning how to do hard things. I believe that the
        more frequently you do difficult things, the more you improve at all
        difficult things. After putting in thousands of hours of practice, I
        believe my tenacity and desire to work on hard problems has only
        increased.
